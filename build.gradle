plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.j2kt'
version = '0.1.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'pumpkin-stub'
        }
    }
}
